[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xrpl-x402-spend-binding"
version = "0.1.0"
description = "Pure spend checks for x402 buyers on XRPL: approval-signature binding and a three-cap guard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
example = ["xrpl-py", "x402-xrpl"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/akadmc9/xrpl-x402-spend-binding"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
